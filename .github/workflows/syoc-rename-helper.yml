name: Polish Switch On Your Code rename

on:
  pull_request:
    branches:
      - agent/syoc-rename-helper

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'agent/syoc-rename-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/switch-on-your-code-rename
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Polish human-facing branding
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          for path in [Path('README.md'), *Path('.').rglob('*.go')]:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('SwitchOnYourCode', 'Switch On Your Code')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          gofmt -w .
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md '*.go' 'openfeature/*.go'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: Polish Switch On Your Code branding."
          git push origin HEAD:agent/switch-on-your-code-rename
