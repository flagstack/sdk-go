name: Format Switch On Your Code rename

on:
  pull_request:
    branches:
      - agent/syoc-rename-helper

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/syoc-rename-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/switch-on-your-code-rename
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format Go sources
        run: gofmt -w .
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: Format renamed Go SDK."
          git push origin HEAD:agent/switch-on-your-code-rename
