name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Verify module metadata
        run: |
          go mod tidy
          status="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff -- go.mod go.sum
            if git ls-files --others --exclude-standard -- go.sum | grep -q .; then
              git diff --no-index /dev/null go.sum || true
            fi
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
